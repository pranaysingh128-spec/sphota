<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141416" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Sphota — AI-powered clinical documentation for Indian psychiatry. Be present. We'll remember." />
    <title>Sphota — Be Present. We'll Remember.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect + early font CSS fetch to improve LCP on landing hero -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800;1,9..144,700&family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800;1,9..144,700&family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap"
    />
  <!-- Session pre-cache: kick off auth check before React boots, saving one round trip -->
  <script>
    (function() {
      try {
        var k = Object.keys(localStorage).find(function(key) {
          return key.startsWith('sb-') && key.endsWith('-auth-token');
        });
        if (k) { window.__initialSession = JSON.parse(localStorage.getItem(k)); }
      } catch(e) {}
    })();
  </script>
  </head>
  <body>
    <!-- Skeleton rendered immediately — replaces blank white screen while React boots -->
    <div id="root">
      <div class="app-skeleton">
        <div class="skeleton-sidebar">
          <div class="skeleton-header"></div>
          <div class="skeleton-search"></div>
          <div class="skeleton-patient-card"></div>
          <div class="skeleton-patient-card"></div>
          <div class="skeleton-patient-card"></div>
        </div>
        <div class="skeleton-main">
          <div class="skeleton-toolbar"></div>
          <div class="skeleton-content">
            <div class="skeleton-block tall"></div>
            <div class="skeleton-block"></div>
            <div class="skeleton-block short"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
